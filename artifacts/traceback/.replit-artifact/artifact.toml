kind = "web"
previewPath = "/"
title = "TraceBack"
description = "A privacy-first lost and found network that connects people and organizations through smart matching, secure verification, and recovery workflows."
version = "1.0.0"
id = "artifacts/traceback"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20363

[services.development]
run = "pnpm --filter @workspace/traceback run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/traceback", "run", "build" ]
serve = "static"
publicDir = "artifacts/traceback/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20363"
BASE_PATH = "/"
